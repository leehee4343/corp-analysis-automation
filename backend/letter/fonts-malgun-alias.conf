<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- 공문 템플릿 글꼴(맑은 고딕)은 Linux 서버에 넣을 수 없어 나눔고딕으로 대체한다 (backend/letter/image.py 참고).
     Dockerfile이 /etc/fonts/conf.d/에 복사한다. -->
<fontconfig>
  <alias binding="same">
    <family>Malgun Gothic</family>
    <prefer><family>NanumGothic</family></prefer>
  </alias>
  <alias binding="same">
    <family>맑은 고딕</family>
    <prefer><family>NanumGothic</family></prefer>
  </alias>
</fontconfig>
